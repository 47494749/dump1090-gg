<script>
var chartColors={
    cpu:'#4fc3f7', cpuSys:'#7986cb',
    rss:'#ef5350', memAvail:'#66bb6a',
    adsbMsg:'#42a5f5',
    adsbNoise:'#ff9800', adsbSignal:'#ffee58', adsbGain:'#26a69a',
    flarmDet:'#78909c', flarmDec:'#4fc3f7',
    acarsDec:'#ec407a', vdl2Dec:'#7e57c2',
    sondeDec:'#26c6da', pocsagDec:'#d4e157',
    gsmBcch:'#ffa726', lteMib:'#42a5f5',
    fanetDec:'#66bb6a', sarsatFrm:'#ef5350',
    trafficRawOut:'#29b6f6', trafficBeastCooked:'#ab47bc',
    trafficBeastVerbatim:'#ef5350', trafficBeastLocal:'#ffa726',
    trafficBasestation:'#66bb6a', trafficStratux:'#8d6e63',
    trafficRawIn:'#26c6da', trafficBeastIn:'#ec407a',
    dongle:['#4fc3f7','#66bb6a','#ff9800','#ec407a','#7e57c2','#26c6da','#d4e157','#8d6e63']
};
var chartInstances={};
var receiverMeta=[];
var prevChartHash='';
var historyBounds={min:null,max:null};
var historyIntervalMs=60000;
var trafficPortMap={};
var trafficSeries=[
    {key:'tro',descr:'Raw TCP output',dir:'OUT',color:chartColors.trafficRawOut},
    {key:'tbc',descr:'Beast TCP output (cooked mode)',dir:'OUT',color:chartColors.trafficBeastCooked},
    {key:'tbv',descr:'Beast TCP output (verbatim mode)',dir:'OUT',color:chartColors.trafficBeastVerbatim},
    {key:'tbl',descr:'Beast TCP output (verbatim+local mode)',dir:'OUT',color:chartColors.trafficBeastLocal},
    {key:'tbs',descr:'Basestation TCP output',dir:'OUT',color:chartColors.trafficBasestation},
    {key:'tst',descr:'Stratux TCP output',dir:'OUT',color:chartColors.trafficStratux},
    {key:'tri',descr:'Raw TCP input',dir:'IN',color:chartColors.trafficRawIn},
    {key:'tbi',descr:'Beast TCP input',dir:'IN',color:chartColors.trafficBeastIn}
];

/* ---- Per-chart view state ---- */
function getChartView(key){
    var ci=chartInstances[key];
    return ci&&ci._view?ci._view:{min:null,max:null};
}
function setChartView(key,min,max){
    if(!chartInstances[key])return;
    chartInstances[key]._view={min:min,max:max};
}
function hasChartView(key){
    var v=getChartView(key);
    return v.min!==null&&v.max!==null;
}

function setHistoryBounds(snapshots,intervalS){
    if(!snapshots||snapshots.length===0){
        historyBounds.min=null;historyBounds.max=null;historyIntervalMs=60000;gapThresholdMs=180000;return;
    }
    historyBounds.min=snapshots[0].t;
    historyBounds.max=snapshots[snapshots.length-1].t;
    historyIntervalMs=Math.max(1000,(intervalS||60)*1000);
    gapThresholdMs=historyIntervalMs*3;
}

function clampView(min,max){
    if(historyBounds.min===null)return{min:min,max:max};
    var fMin=historyBounds.min,fMax=historyBounds.max;
    var minSpan=Math.max(historyIntervalMs*2,60000);
    var fSpan=Math.max(fMax-fMin,minSpan);
    var span=Math.max((max||0)-(min||0),minSpan);
    if(span>=fSpan)return{min:fMin,max:fMax};
    if(min<fMin){max+=fMin-min;min=fMin;}
    if(max>fMax){min-=max-fMax;max=fMax;}
    if(min<fMin)min=fMin;if(max>fMax)max=fMax;
    if(max-min<minSpan){max=Math.min(fMax,min+minSpan);min=Math.max(fMin,max-minSpan);}
    return{min:min,max:max};
}

function applyChartView(key){
    var chart=chartInstances[key];
    if(!chart||!chart.options||!chart.options.scales||!chart.options.scales.x)return;
    if(hasChartView(key)){
        var v=getChartView(key);
        var c=clampView(v.min,v.max);
        chart.options.scales.x.min=c.min;chart.options.scales.x.max=c.max;
    }else{
        delete chart.options.scales.x.min;delete chart.options.scales.x.max;
    }
    chart.update('none');
}

function resetChartView(key){
    setChartView(key,null,null);applyChartView(key);
}

function zoomChart(key,factor,anchorMs){
    if(historyBounds.min===null)return;
    var v=hasChartView(key)?getChartView(key):{min:historyBounds.min,max:historyBounds.max};
    var span=v.max-v.min,fSpan=historyBounds.max-historyBounds.min;
    var newSpan=Math.max(Math.min(span*factor,fSpan),Math.max(historyIntervalMs*2,60000));
    if(!isFinite(anchorMs))anchorMs=v.min+span/2;
    var ratio=span>0?(anchorMs-v.min)/span:0.5;
    var nMin=anchorMs-newSpan*ratio;
    var c=clampView(nMin,nMin+newSpan);
    setChartView(key,c.min,c.max);applyChartView(key);
}

function panChart(key,fraction){
    if(historyBounds.min===null)return;
    var v=hasChartView(key)?getChartView(key):{min:historyBounds.min,max:historyBounds.max};
    var shift=(v.max-v.min)*fraction;
    var c=clampView(v.min+shift,v.max+shift);
    setChartView(key,c.min,c.max);applyChartView(key);
}

function formatTrafficLabel(series){
    var ports=trafficPortMap[series.descr];
    var suffix=ports&&ports.length?' ['+ports.join('/')+']':'';
    return series.descr+suffix+' '+series.dir;
}

function updateTrafficLabels(){
    if(!chartInstances.traffic)return;
    chartInstances.traffic.data.datasets.forEach(function(ds,i){
        ds.label=formatTrafficLabel(trafficSeries[i]);
    });
    chartInstances.traffic.update('none');
}

function loadTrafficConnections(){
    fetch('/api/connections').then(function(r){return r.json();}).then(function(data){
        var map={};
        (data.services||[]).forEach(function(service){
            map[service.descr]=service.listeners||[];
        });
        trafficPortMap=map;
        updateTrafficLabels();
    }).catch(function(){});
}

function attachChartInteractions(chart,key){
    if(!chart||!chart.canvas||chart.canvas.dataset.histBound==='1')return;
    var canvas=chart.canvas;
    var dragState=null;
    canvas.dataset.histBound='1';
    canvas.style.cursor='grab';

    canvas.addEventListener('wheel',function(ev){
        var scale=chart.scales&&chart.scales.x;
        if(!scale||historyBounds.min===null)return;
        ev.preventDefault();
        var anchor=scale.getValueForPixel(ev.offsetX);
        if(anchor&&anchor.valueOf)anchor=anchor.valueOf();
        zoomChart(key,ev.deltaY<0?0.8:1.25,anchor);
    },{passive:false});

    canvas.addEventListener('mousedown',function(ev){
        if(ev.button!==0||historyBounds.min===null)return;
        var v=hasChartView(key)?getChartView(key):{min:historyBounds.min,max:historyBounds.max};
        dragState={startX:ev.offsetX,min:v.min,max:v.max,
            width:(chart.chartArea&&chart.chartArea.right-chart.chartArea.left)||canvas.clientWidth||1};
        canvas.style.cursor='grabbing';ev.preventDefault();
    });
    canvas.addEventListener('mousemove',function(ev){
        if(!dragState)return;
        var span=dragState.max-dragState.min;
        var shift=-(ev.offsetX-dragState.startX)/dragState.width*span;
        var c=clampView(dragState.min+shift,dragState.max+shift);
        setChartView(key,c.min,c.max);applyChartView(key);
    });
    function endDrag(){if(!dragState)return;dragState=null;canvas.style.cursor='grab';}
    canvas.addEventListener('mouseup',endDrag);
    canvas.addEventListener('mouseleave',endDrag);
    window.addEventListener('mouseup',endDrag);
    canvas.addEventListener('dblclick',function(){resetChartView(key);});
}

function makeChartOpts(yLabel,noZero){
    return {
        responsive:true,maintainAspectRatio:false,animation:{duration:0},
        interaction:{mode:'index',intersect:false},
        plugins:{
            legend:{labels:{color:'#aaa',font:{size:11}},position:'top'},
            tooltip:{backgroundColor:'#1a1a2e',borderColor:'#2a2a4a',borderWidth:1,
                     titleColor:'#4fc3f7',bodyColor:'#d0d0d0'}
        },
        scales:{
            x:{type:'time',
               time:{tooltipFormat:'yyyy-MM-dd HH:mm:ss',
                     displayFormats:{second:'HH:mm',minute:'HH:mm',hour:'HH:mm',day:'MMM d'}},
               ticks:{color:'#888',maxTicksLimit:8},grid:{color:'#1a1a2e'}},
            y:{ticks:{color:'#888'},grid:{color:'#1a1a2e'},beginAtZero:!noZero,
               title:yLabel?{display:true,text:yLabel,color:'#888'}:undefined}
        }
    };
}

function chartContainerHTML(id,title){
    return '<div class="chart-container" data-chart-key="'+id+'">'+
        '<div class="chart-header"><h3>'+title+'</h3>'+
        '<div class="chart-toolbar">'+
        '<button data-action="zoomin" title="Zoom in">+</button>'+
        '<button data-action="zoomout" title="Zoom out">&minus;</button>'+
        '<button data-action="panleft" title="Pan left">&#x25c0;</button>'+
        '<button data-action="panright" title="Pan right">&#x25b6;</button>'+
        '<button data-action="reset" title="Reset view">Reset</button>'+
        '</div></div>'+
        '<div class="chart-wrap"><canvas id="'+id+'"></canvas></div></div>';
}

function bindToolbarEvents(){
    document.querySelectorAll('.chart-toolbar button').forEach(function(btn){
        btn.addEventListener('click',function(){
            var key=btn.closest('.chart-container').dataset.chartKey;
            var action=btn.dataset.action;
            if(action==='zoomin')zoomChart(key,0.5);
            else if(action==='zoomout')zoomChart(key,2);
            else if(action==='panleft')panChart(key,-0.25);
            else if(action==='panright')panChart(key,0.25);
            else if(action==='reset')resetChartView(key);
        });
    });
}

function makeChart(canvasId,labels,colors,yLabel,opts){
    var canvas=document.getElementById(canvasId);
    if(!canvas)return null;
    opts=opts||{};
    var cfg=makeChartOpts(yLabel,opts.noZero);
    if(!Array.isArray(labels)){labels=[labels];colors=[colors];}
    var datasets=labels.map(function(l,i){
        return {label:l,data:[],borderColor:colors[i],
                backgroundColor:'transparent',borderWidth:1.5,pointRadius:0,tension:.3};
    });
    var chart=new Chart(canvas,{type:'line',data:{datasets:datasets},options:cfg});
    chart._view={min:null,max:null};
    attachChartInteractions(chart,canvasId);
    return chart;
}

// Gap threshold: if time between snapshots > 3x interval, insert null to break the line
var gapThresholdMs=historyIntervalMs*3;

function computeRates(snapshots,key){
    var rates=[];
    for(var i=1;i<snapshots.length;i++){
        var dt=(snapshots[i].t-snapshots[i-1].t)/60000;
        if(dt<=0)continue;
        if((snapshots[i].t-snapshots[i-1].t)>gapThresholdMs){
            rates.push({x:new Date(snapshots[i-1].t+1),y:null});
        }
        var dv=snapshots[i][key]-snapshots[i-1][key];
        // After a gap, cumulative counters reset — clamp to 0
        rates.push({x:new Date(snapshots[i].t),y:dt>0?Math.max(0,dv/dt):0});
    }
    return rates;
}

function computeRatePerSecond(snapshots,key){
    var rates=[];
    for(var i=1;i<snapshots.length;i++){
        var dt=(snapshots[i].t-snapshots[i-1].t)/1000;
        if(dt<=0)continue;
        if((snapshots[i].t-snapshots[i-1].t)>gapThresholdMs){
            rates.push({x:new Date(snapshots[i-1].t+1),y:null});
        }
        var dv=(snapshots[i][key]||0)-(snapshots[i-1][key]||0);
        rates.push({x:new Date(snapshots[i].t),y:dt>0?Math.max(0,dv/dt):0});
    }
    return rates;
}

function computeDongleRate(snapshots,idx){
    // Compute per-dongle sample rate in Msps from cumulative rs[] array
    var rates=[];
    for(var i=1;i<snapshots.length;i++){
        var dt=(snapshots[i].t-snapshots[i-1].t)/1000;
        if(dt<=0)continue;
        if((snapshots[i].t-snapshots[i-1].t)>gapThresholdMs){
            rates.push({x:new Date(snapshots[i-1].t+1),y:null});
        }
        var cur=snapshots[i].rs?snapshots[i].rs[idx]:0;
        var prev=snapshots[i-1].rs?snapshots[i-1].rs[idx]:0;
        if(!cur||!prev){rates.push({x:new Date(snapshots[i].t),y:null});continue;}
        var dv=cur-prev;
        rates.push({x:new Date(snapshots[i].t),y:dt>0?Math.max(0,dv/dt/1e6):0});
    }
    return rates;
}

function instantValues(snapshots,key){
    var vals=[];
    for(var i=0;i<snapshots.length;i++){
        if(i>0&&(snapshots[i].t-snapshots[i-1].t)>gapThresholdMs){
            vals.push({x:new Date(snapshots[i-1].t+1),y:null});
        }
        vals.push({x:new Date(snapshots[i].t),y:snapshots[i][key]});
    }
    return vals;
}

function filteredValues(snapshots,key,minVal){
    var vals=[];
    for(var i=0;i<snapshots.length;i++){
        if(snapshots[i][key]<=minVal)continue;
        if(i>0&&(snapshots[i].t-snapshots[i-1].t)>gapThresholdMs){
            vals.push({x:new Date(snapshots[i-1].t+1),y:null});
        }
        vals.push({x:new Date(snapshots[i].t),y:snapshots[i][key]});
    }
    return vals;
}

function buildCharts(hist){
    var container=document.getElementById('charts-container');
    var section=document.getElementById('charts-section');
    var notice=document.getElementById('history-notice');
    var snaps,hasAdsb,hasFlarm,hasAcars,hasVdl2,hasSonde,hasPocsag,hasGsm,hasLte,hasFanet,hasSarsat,hash,html,decoders;

    if(!hist.config.enabled){
        section.style.display='block';
        notice.textContent='Stats history is disabled. Enable it above to see time-series graphs.';
        notice.style.display='block';
        container.innerHTML='';
        prevChartHash='';
        return;
    }
    if(hist.snapshots.length<2){
        section.style.display='block';
        notice.textContent='Collecting data... Graphs will appear after at least 2 snapshots (interval: '+hist.config.interval_s+'s).';
        notice.style.display='block';
        container.innerHTML='';
        prevChartHash='';
        return;
    }

    notice.style.display='none';
    section.style.display='block';
    snaps=hist.snapshots;
    setHistoryBounds(snaps,hist.config.effective_interval_s||hist.config.interval_s);

    // Store receiver metadata for chart labels
    if(hist.receivers)receiverMeta=hist.receivers;

    hasAdsb=snaps.some(function(s){return s.am>0;});
    hasFlarm=snaps.some(function(s){return s.fd>0||s.fc>0;});
    hasAcars=snaps.some(function(s){return s.ad>0;});
    hasVdl2=snaps.some(function(s){return s.vd>0;});
    hasSonde=snaps.some(function(s){return s.sd>0;});
    hasPocsag=snaps.some(function(s){return s.pd>0;});
    hasGsm=snaps.some(function(s){return s.gb>0;});
    hasLte=snaps.some(function(s){return s.lm>0;});
    hasFanet=snaps.some(function(s){return s.nd>0;});
    hasSarsat=snaps.some(function(s){return s.sf>0;});
    var hasDongle=snaps.some(function(s){return s.rs&&s.rs.length>0;});

    hash=[hasAdsb,hasFlarm,hasAcars,hasVdl2,hasSonde,hasPocsag,hasGsm,hasLte,hasFanet,hasSarsat,hasDongle].join(',');
    if(hash===prevChartHash){
        updateChartsData(hist);
        return;
    }
    prevChartHash=hash;

    Object.keys(chartInstances).forEach(function(k){
        if(chartInstances[k])chartInstances[k].destroy();
    });
    chartInstances={};

    html='';
    html+=chartContainerHTML('ch-traffic','Port Traffic (KB/s)');
    if(hasDongle)html+=chartContainerHTML('ch-dongle','Dongle Throughput (Msps)');
    html+='<div class="chart-row">';
    html+=chartContainerHTML('ch-cpu','CPU Usage (rate per minute)');
    html+=chartContainerHTML('ch-mem','Memory');
    html+='</div>';

    if(hasAdsb){
        html+='<div class="chart-row">';
        html+=chartContainerHTML('ch-adsb-msg','ADS-B Messages (rate/min)');
        html+=chartContainerHTML('ch-adsb-rf','ADS-B Signal and Noise (dBFS)');
        html+='</div>';
        html+='<div class="chart-row">';
        html+=chartContainerHTML('ch-adsb-gain','ADS-B Gain (dB)');
        html+='<div class="chart-container" style="visibility:hidden"></div>';
        html+='</div>';
    }

    decoders=[];
    if(hasFlarm)decoders.push({id:'ch-flarm',title:'FLARM (rate/min)',multi:true});
    if(hasAcars)decoders.push({id:'ch-acars',title:'ACARS Decoded (rate/min)',color:chartColors.acarsDec});
    if(hasVdl2)decoders.push({id:'ch-vdl2',title:'VDL2 Decoded (rate/min)',color:chartColors.vdl2Dec});
    if(hasSonde)decoders.push({id:'ch-sonde',title:'Radiosonde Decoded (rate/min)',color:chartColors.sondeDec});
    if(hasPocsag)decoders.push({id:'ch-pocsag',title:'POCSAG Decoded (rate/min)',color:chartColors.pocsagDec});
    if(hasGsm)decoders.push({id:'ch-gsm',title:'GSM BCCH (rate/min)',color:chartColors.gsmBcch});
    if(hasLte)decoders.push({id:'ch-lte',title:'LTE MIB (rate/min)',color:chartColors.lteMib});
    if(hasFanet)decoders.push({id:'ch-fanet',title:'FANET Decoded (rate/min)',color:chartColors.fanetDec});
    if(hasSarsat)decoders.push({id:'ch-sarsat',title:'SARSAT Frames (rate/min)',color:chartColors.sarsatFrm});

    for(var i=0;i<decoders.length;i+=2){
        html+='<div class="chart-row">';
        html+=chartContainerHTML(decoders[i].id,decoders[i].title);
        if(i+1<decoders.length){
            html+=chartContainerHTML(decoders[i+1].id,decoders[i+1].title);
        }else{
            html+='<div class="chart-container" style="visibility:hidden"></div>';
        }
        html+='</div>';
    }

    container.innerHTML=html;
    bindToolbarEvents();

    chartInstances['ch-traffic']=makeChart('ch-traffic',trafficSeries.map(formatTrafficLabel),trafficSeries.map(function(s){return s.color;}),'KB/s',{noZero:true});
    if(hasDongle){
        var dlabels=[],dcolors=[];
        for(var d=0;d<receiverMeta.length;d++){
            var rm=receiverMeta[d];
            dlabels.push('rx['+d+'] '+rm.serial+' ('+rm.role+')');
            dcolors.push(chartColors.dongle[d%chartColors.dongle.length]);
        }
        chartInstances['ch-dongle']=makeChart('ch-dongle',dlabels,dcolors,'Msps');
    }
    chartInstances['ch-cpu']=makeChart('ch-cpu',['User CPU','System CPU'],[chartColors.cpu,chartColors.cpuSys],'CPU s/min');
    chartInstances['ch-mem']=makeChart('ch-mem',['RSS','Available'],[chartColors.rss,chartColors.memAvail],'MB');

    if(hasAdsb){
        chartInstances['ch-adsb-msg']=makeChart('ch-adsb-msg','Messages',chartColors.adsbMsg,'msg/min');
        chartInstances['ch-adsb-rf']=makeChart('ch-adsb-rf',['Signal','Noise'],[chartColors.adsbSignal,chartColors.adsbNoise],'dBFS',{noZero:true});
        chartInstances['ch-adsb-gain']=makeChart('ch-adsb-gain','Gain',chartColors.adsbGain,'dB',{noZero:true});
    }
    if(hasFlarm){
        chartInstances['ch-flarm']=makeChart('ch-flarm',['Detected','Decoded'],[chartColors.flarmDet,chartColors.flarmDec],'pkts/min');
    }
    decoders.forEach(function(dec){
        if(!dec.multi&&!chartInstances[dec.id]){
            chartInstances[dec.id]=makeChart(dec.id,'Decoded',dec.color,'/min');
        }
    });

    updateChartsData(hist);
}

function updateChartsData(hist){
    var snaps,keyMap,mode='none';
    if(!hist.config.enabled||hist.snapshots.length<2)return;
    snaps=hist.snapshots;

    if(chartInstances['ch-traffic']){
        chartInstances['ch-traffic'].data.datasets.forEach(function(ds,i){
            ds.label=formatTrafficLabel(trafficSeries[i]);
            ds.data=computeRatePerSecond(snaps,trafficSeries[i].key);
            ds.borderDash=trafficSeries[i].dir==='IN'?[6,3]:[];
        });
        chartInstances['ch-traffic'].update(mode);
    }
    if(chartInstances['ch-dongle']){
        var nRx=chartInstances['ch-dongle'].data.datasets.length;
        for(var d=0;d<nRx;d++){
            chartInstances['ch-dongle'].data.datasets[d].data=computeDongleRate(snaps,d);
        }
        chartInstances['ch-dongle'].update(mode);
    }
    if(chartInstances['ch-cpu']){
        chartInstances['ch-cpu'].data.datasets[0].data=computeRates(snaps,'cu');
        chartInstances['ch-cpu'].data.datasets[1].data=computeRates(snaps,'cs');
        chartInstances['ch-cpu'].update(mode);
    }
    if(chartInstances['ch-mem']){
        chartInstances['ch-mem'].data.datasets[0].data=instantValues(snaps,'rss').map(function(p){return p.y!==null?{x:p.x,y:p.y/1024}:p;});
        chartInstances['ch-mem'].data.datasets[1].data=instantValues(snaps,'ma').map(function(p){return p.y!==null?{x:p.x,y:p.y/1024}:p;});
        chartInstances['ch-mem'].update(mode);
    }
    if(chartInstances['ch-adsb-msg']){
        chartInstances['ch-adsb-msg'].data.datasets[0].data=computeRates(snaps,'am');
        chartInstances['ch-adsb-msg'].update(mode);
    }
    if(chartInstances['ch-adsb-rf']){
        chartInstances['ch-adsb-rf'].data.datasets[0].data=filteredValues(snaps,'as',-900);
        chartInstances['ch-adsb-rf'].data.datasets[1].data=filteredValues(snaps,'an',-900);
        if(chartInstances['ch-adsb-rf'].data.datasets[1].borderDash===undefined)
            chartInstances['ch-adsb-rf'].data.datasets[1].borderDash=[4,2];
        chartInstances['ch-adsb-rf'].update(mode);
    }
    if(chartInstances['ch-adsb-gain']){
        chartInstances['ch-adsb-gain'].data.datasets[0].data=instantValues(snaps,'ag');
        chartInstances['ch-adsb-gain'].update(mode);
    }
    if(chartInstances['ch-flarm']){
        chartInstances['ch-flarm'].data.datasets[0].data=computeRates(snaps,'fd');
        chartInstances['ch-flarm'].data.datasets[1].data=computeRates(snaps,'fc');
        chartInstances['ch-flarm'].update(mode);
    }
    keyMap={'ch-acars':'ad','ch-vdl2':'vd','ch-sonde':'sd','ch-pocsag':'pd',
            'ch-gsm':'gb','ch-lte':'lm','ch-fanet':'nd','ch-sarsat':'sf'};
    Object.keys(keyMap).forEach(function(id){
        if(chartInstances[id]){
            chartInstances[id].data.datasets[0].data=computeRates(snaps,keyMap[id]);
            chartInstances[id].update(mode);
        }
    });

    // Re-apply per-chart views (preserve zoom state on data refresh)
    Object.keys(chartInstances).forEach(function(key){
        if(hasChartView(key))applyChartView(key);
    });
}

// ===== Config bar =====
function loadHistConfig(){
    fetch('/api/stats-history?max_points=1').then(function(r){return r.json();}).then(function(hist){
        if(hist.config){
            document.getElementById('hist-enabled').checked=hist.config.enabled;
            document.getElementById('hist-interval').value=String(Math.max(1,Math.round((hist.config.interval_s||60)/60)));
            document.getElementById('hist-retention').value=String(Math.max(1,Math.round((hist.config.retention_hours||24)/24)));
        }
        refreshHistory();
    }).catch(function(){ refreshHistory(); });
}

document.getElementById('hist-save').addEventListener('click',function(){
    var enabled=document.getElementById('hist-enabled').checked;
    var intervalMin=parseInt(document.getElementById('hist-interval').value)||1;
    var retentionDays=parseInt(document.getElementById('hist-retention').value)||1;
    if(intervalMin<1)intervalMin=1;if(intervalMin>60)intervalMin=60;
    if(retentionDays<1)retentionDays=1;if(retentionDays>90)retentionDays=90;
    var retentionHours=retentionDays*24;
    fetch('/api/config').then(function(r){return r.json();}).then(function(cfg){
        cfg.stats_history={enabled:enabled,retention_hours:retentionHours,interval_minutes:intervalMin};
        return fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
    }).then(function(r){return r.json();}).then(function(res){
        var st=document.getElementById('hist-status');
        st.textContent=res.status==='saved'?'Saved!':'Error: '+JSON.stringify(res);
        st.style.color=res.status==='saved'?'var(--ok)':'var(--danger)';
        setTimeout(function(){st.textContent='';},3000);
        setTimeout(refreshHistory,1000);
    }).catch(function(e){
        document.getElementById('hist-status').textContent='Error: '+e.message;
    });
});

// ===== Render system stats =====
function fmtKB(kb){
    if(kb>=1048576)return (kb/1048576).toFixed(1)+' GB';
    if(kb>=1024)return (kb/1024).toFixed(1)+' MB';
    return kb+' KB';
}
function fmtUptime(s){
    if(s>=86400)return (s/86400).toFixed(1)+' days';
    if(s>=3600)return (s/3600).toFixed(1)+' hours';
    if(s>=60)return (s/60).toFixed(1)+' min';
    return s.toFixed(0)+' s';
}
function statBox(label,value,unit){
    return '<div class="stat-box"><div class="label">'+label+'</div><div class="value">'+value+(unit?'<span class="unit">'+unit+'</span>':'')+'</div></div>';
}
function renderSystem(d){
    var el=document.getElementById('system-stats');
    if(!el||!d)return;
    var p=d.process||{},s=d.system||{},c=d.cpu||{};
    var usedPct=s.mem_total_kb>0?((s.mem_total_kb-s.mem_available_kb)/s.mem_total_kb*100).toFixed(1):'?';
    var barClass=parseFloat(usedPct)>90?'danger':parseFloat(usedPct)>70?'warn':'';
    el.innerHTML=
        statBox('Uptime',fmtUptime(d.uptime_s||0))+
        statBox('RSS',fmtKB(p.vm_rss_kb||0))+
        statBox('VM Size',fmtKB(p.vm_size_kb||0))+
        statBox('VM Peak',fmtKB(p.vm_peak_kb||0))+
        statBox('User CPU',(c.utime_s||0).toFixed(1),'s')+
        statBox('System CPU',(c.stime_s||0).toFixed(1),'s')+
        '<div class="stat-box"><div class="label">System RAM</div><div class="value">'+usedPct+'<span class="unit">% used</span></div>'+
        '<div style="color:var(--dim);font-size:11px;margin-top:2px">'+fmtKB(s.mem_available_kb||0)+' available / '+fmtKB(s.mem_total_kb||0)+' total</div>'+
        '<div class="bar-bg"><div class="bar-fg '+barClass+'" style="width:'+usedPct+'%"></div></div></div>';
}

// ===== Render decoder stats =====
function renderDecoders(d){
    var el=document.getElementById('decoder-stats');
    if(!el||!d)return;
    var html='<table class="decoder-table"><tr><th>Decoder</th><th>RX</th><th>Samples</th><th>Messages</th><th>Signal</th><th>Noise</th><th>Gain</th><th>Details</th></tr>';
    if(d.adsb){
        var a=d.adsb;
        html+='<tr><td>ADS-B</td><td class="num">'+a.rx+'</td><td class="num">'+(a.samples||0).toLocaleString()+'</td><td class="num">'+(a.messages_total||0).toLocaleString()+'</td>';
        html+='<td class="num">'+(a.signal_dbfs!=null?a.signal_dbfs.toFixed(1)+' dBFS':'—')+'</td>';
        html+='<td class="num">'+(a.noise_dbfs!=null?a.noise_dbfs.toFixed(1)+' dBFS':'—')+'</td>';
        html+='<td class="num">'+(a.gain_db!=null?(a.gain_db<0?'AGC':a.gain_db.toFixed(1)+' dB'):'—')+'</td>';
        html+='<td>Tracks: '+a.tracks+' | Strong: '+a.strong_signals+' | CRC rescued: '+a.crc_rescued+'</td></tr>';
    }
    var decoders=[
        {key:'flarm',name:'FLARM',msg:'decoded'},
        {key:'acars',name:'ACARS',msg:'decoded'},
        {key:'vdl2',name:'VDL2',msg:'decoded'},
        {key:'sonde',name:'Radiosonde',msg:'decoded'},
        {key:'pocsag',name:'POCSAG',msg:'decoded'},
        {key:'gsm',name:'GSM',msg:'bcch_decoded'},
        {key:'lte',name:'LTE',msg:'mib_decoded'},
        {key:'fanet',name:'FANET',msg:'decoded'},
        {key:'sarsat',name:'SARSAT',msg:'frames'}
    ];
    decoders.forEach(function(dec){
        var v=d[dec.key];
        if(!v)return;
        var msgs=v[dec.msg]||v.decoded||v.messages_total||v.syncs||0;
        html+='<tr><td>'+dec.name+'</td><td class="num">'+(v.rx!=null?v.rx:'—')+'</td><td class="num">'+(v.samples||0).toLocaleString()+'</td>';
        html+='<td class="num">'+msgs.toLocaleString()+'</td><td class="num">—</td><td class="num">—</td><td class="num">—</td>';
        var details=[];
        if(v.preambles)details.push('Preambles: '+v.preambles.toLocaleString());
        if(v.syncs||v.sync_ok)details.push('Syncs: '+(v.syncs||v.sync_ok).toLocaleString());
        if(v.crc_errors)details.push('CRC err: '+v.crc_errors);
        html+='<td>'+(details.length?details.join(' | '):'—')+'</td></tr>';
    });
    html+='</table>';
    el.innerHTML=html;
}

// ===== Refresh loop =====
var HISTORY_MAX_POINTS=600;

function refreshHistory(){
    fetch('/api/stats-history?max_points='+HISTORY_MAX_POINTS).then(function(r){return r.json();}).then(function(hist){
        document.getElementById('hist-enabled').checked=hist.config.enabled;
        document.getElementById('hist-interval').value=String(Math.max(1,Math.round((hist.config.interval_s||60)/60)));
        document.getElementById('hist-retention').value=String(Math.max(1,Math.round((hist.config.retention_hours||24)/24)));
        buildCharts(hist);
    }).catch(function(e){
        console.error('Stats history error:',e);
    });
}

async function refresh(){
    try{
        var results=await Promise.all([
            fetch('/api/system-stats').then(function(r){return r.json();}),
            fetch('/api/decoder-stats').then(function(r){return r.json();})
        ]);
        renderSystem(results[0]);
        renderDecoders(results[1]);
        document.getElementById('last-update').textContent='Updated: '+new Date().toLocaleTimeString();
    }catch(e){
        console.error('Stats refresh error:',e);
    }
}

// Initial load
loadHistConfig();
loadTrafficConnections();
refresh();

// Periodic refresh
setInterval(refresh,5000);
setInterval(loadTrafficConnections,30000);
setInterval(refreshHistory,15000);
</script>
