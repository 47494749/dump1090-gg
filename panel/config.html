<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dump1090-gg — Config</title>
<style>
:root{--bg:#0a0a1a;--card:#141428;--border:#2a2a4a;--text:#d0d0d0;--dim:#888;
--accent:#4fc3f7;--danger:#ff4444;--warn:#ffaa00;--link:#44aaff;--ok:#00cc44;
--head:#1a1a2e;--input-bg:#0e0e22;--hover:#1e1e3a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
nav{background:var(--head);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
nav h1{font-size:18px;color:var(--accent);white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tabs a{padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--dim);transition:.2s;font-size:13px;user-select:none;text-decoration:none}
.tabs a:hover{background:var(--hover);color:var(--text)}
.tabs a.active{background:var(--accent);color:#000;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{color:var(--accent);margin-bottom:12px;font-size:15px;border-bottom:1px solid var(--border);padding-bottom:6px}
.field{display:grid;grid-template-columns:200px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.field label{color:var(--dim);font-size:13px;text-align:right}
.field label[title]{cursor:help;border-bottom:1px dotted var(--dim)}
.field input,.field select,.field textarea{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field input[type=checkbox]{width:18px;height:18px;justify-self:start}
.field textarea{font-family:'Cascadia Code','Fira Code',monospace;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--head);color:var(--accent);padding:8px;text-align:left;position:sticky;top:0;z-index:10}
td{padding:6px 8px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--hover)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:#003322;color:var(--ok)}
.badge.warn{background:#332200;color:var(--warn)}
.badge.err{background:#330000;color:var(--danger)}
.badge.info{background:#002244;color:var(--link)}
.btn{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn-primary{background:var(--accent);color:#000}.btn-primary:hover{filter:brightness(1.2)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{filter:brightness(1.2)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.main{padding:16px;max-width:1600px;margin:0 auto}
.section-toggle{cursor:pointer;user-select:none}
.section-toggle::before{content:'▶ ';font-size:11px}
.section-toggle.open::before{content:'▼ '}
@media(max-width:768px){.field{grid-template-columns:1fr}.field label{text-align:left}}
</style>
</head>
<body>
<nav>
<h1>✈ dump1090-gg-light</h1>
<div class="tabs">
<a href="/">🗺️ Map</a>
<a class="active" href="/config.html">⚙️ Config</a>
<a href="/feeders.html">📡 Feeders</a>
<a href="/status.html">📡 Status</a>
<a href="/connections.html">🔌 Connections</a>
<a href="/logs.html">📋 Logs</a>
<a href="/messages.html">📨 Messages</a>
<a href="/aircraft.html">✈️ Aircraft</a>
<a href="/devices.html">📻 Devices</a>
<a href="/gsm.html">📶 GSM</a>
<a href="/lte.html">📶 LTE</a>
<a href="/iot868.html">🌡️ IoT 868</a>
<a href="/fanet.html">🚩 FANET</a>
<a href="/stats.html">📊 Stats</a>
<a href="/waterfall.html">🌊 Waterfall</a>
<a href="/diagnostics.html" style="margin-left:auto">🔧 Diagnostics</a>
</div>
<span id="ver-badge" style="margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap;padding:2px 8px;border:1px solid var(--border);border-radius:10px" title="dump1090-gg version">v…</span>
</nav>

<div class="main">
<div class="toolbar">
<button class="btn btn-primary" onclick="saveConfig()">💾 Save</button>
<span id="save-status" style="color:var(--dim)"></span>
</div>
<div id="config-form"></div>
</div>

<script>
let cfg={};

const configSchema=[
{title:'📍 Station',id:'station',fields:[
    {k:'station.name',l:'Station name',t:'text',h:'Station identifier — used as MLAT username, and for OGN if not specified otherwise'},
    {k:'station.lat',l:'Latitude',t:'number',s:'0.000001'},
    {k:'station.lon',l:'Longitude',t:'number',s:'0.000001'},
    {k:'station.max_range',l:'Max Range (NM)',t:'number',s:'1'},
    {k:'mlat.alt',l:'Altitude (m)',t:'number',s:'1',h:'Station altitude — also used for MLAT'},
]},

{title:'📊 Network',id:'network',fields:[
    {k:'network.raw_out',l:'Raw output ports',t:'text',h:'Ports for raw output (default: 30002)'},
    {k:'network.raw_in',l:'Raw input ports',t:'text',h:'Ports for raw input (default: 30001)'},
    {k:'network.sbs_out',l:'SBS output ports',t:'text',h:'Ports for SBS/BaseStation output (default: 30003)'},
    {k:'network.beast_in',l:'Beast input ports',t:'text',h:'Ports for Beast input (default: 30004,30104)'},
    {k:'network.beast_out',l:'Beast output ports',t:'text',h:'Ports for Beast output (default: 30005)'},
    {k:'network.json_dir',l:'JSON directory',t:'text',h:'Directory for periodic JSON output (aircraft.json, stats.json)'},
]},
{title:'🔐 Panel',id:'panel',fields:[
    {k:'panel.port',l:'Panel port',t:'number',s:'1'},
    {k:'panel.password',l:'New password',t:'password'},
]},
];

function getNestedVal(obj,path){
    return path.split('.').reduce((o,k)=>o&&o[k],obj);
}

function renderConfigForm(){
    let html='';
    for(const sec of configSchema){
        html+=`<div class="card"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">${sec.title}</h3><div>`;
        for(const f of sec.fields){
            const val=getNestedVal(cfg,f.k);
            const help=f.h?`<div style="grid-column:2;color:var(--dim);font-size:11px;margin-top:-4px;margin-bottom:4px">${f.h}</div>`:'';
            if(f.t==='checkbox'){
                html+=`<div class="field"><label>${f.l}</label><input type="checkbox" data-key="${f.k}" ${val?'checked':''}></div>${help}`;
            }else if(f.t==='textarea'){
                html+=`<div class="field"><label>${f.l}</label><textarea data-key="${f.k}" rows="3">${val||''}</textarea></div>${help}`;
            }else{
                html+=`<div class="field"><label>${f.l}</label><input type="${f.t}" data-key="${f.k}" value="${val!=null?val:''}" ${f.s?'step="'+f.s+'"':''} ${f.t==='text'&&f.k.startsWith('keys.')?'style="font-family:monospace;letter-spacing:1px"':''}></div>${help}`;
            }
        }
        html+=`</div></div>`;
    }

    // Feeder/hub sections moved to feeders.html

    // Dynamic SDR Receivers section (decoder configs only, dongles are on Devices page)
    html+=`<div id="decoder-configs"></div>`;
    document.getElementById('config-form').innerHTML=html;
    loadSdrReceiverConfig();
}

const roleLabels={adsb:'ADS-B (1090 MHz)',flarm:'FLARM / OGNTP (868 MHz)',acars:'ACARS (131 MHz)',vdl2:'VDL2 (136 MHz)',radiosonde:'Radiosonde (403 MHz)',pocsag:'POCSAG (466 MHz)',gsm:'GSM (935 MHz)',lte:'LTE (800 MHz)',iot868:'IoT 868 MHz',fanet:'FANET (868.2 MHz)',sarsat:'SARSAT (406 MHz)'};
const roleIcons={adsb:'✈️',flarm:'🚩',acars:'📡',vdl2:'📡',radiosonde:'🎈',pocsag:'📟',gsm:'📶',lte:'📶',iot868:'🌡️',fanet:'🚩',sarsat:'🚨'};

let decoderCfg={};  // loaded from /api/decoders

function sondeFreqChanged(sel){
    const v=sel.value;
    const modeEl=document.getElementById('sonde-freq-mode-val');
    const freqEl=document.getElementById('sonde-center-freq-val');
    const dwellRow=document.getElementById('sonde-dwell-row');
    if(v==='scan'){
        modeEl.value='1';
        freqEl.value='401000000';
        dwellRow.style.display='';
    }else{
        modeEl.value='0';
        freqEl.value=v.substring(1);
        dwellRow.style.display='none';
    }
}

async function loadSdrReceiverConfig(){
    try{
        const [devRes,rxRes,decRes]=await Promise.all([
            fetch('/api/devices').then(r=>r.json()),
            fetch('/api/receivers').then(r=>r.json()),
            fetch('/api/decoders').then(r=>r.json())
        ]);
        decoderCfg=decRes;

        // Determine which decoder types are active (have a dongle assigned)
        const activeDecoders=new Set();
        if(decRes.dongles){
            for(const d of decRes.dongles){
                if(d.decoder&&d.decoder!=='none') activeDecoders.add(d.decoder);
            }
        }

        // ===== Decoder configs section =====
        let dhtml='';

        // ADS-B decoder
        {const active=activeDecoders.has('adsb');
        const dc=decRes.adsb||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">✈️ ADS-B Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div style="margin-bottom:12px"><strong style="color:var(--dim);font-size:12px">Decode Options</strong></div>`;
        dhtml+=`<div class="field"><label title="Number of bit errors to correct in CRC (0=none, 1=1-bit, 2=2-bit). Higher values recover more messages but may increase false positives.">Error Correction</label><input type="number" step="1" data-dkey="adsb.fix_crc" value="${dc.fix_crc!=null?dc.fix_crc:1}" min="0" max="2"></div>`;
        dhtml+=`<div class="field"><label title="Validate CRC checksum on received messages. Disabling accepts messages without CRC verification.">CRC check</label><input type="checkbox" data-dkey="adsb.check_crc" ${dc.check_crc?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Attempt to correct the Downlink Format (DF) field in corrupted messages to recover otherwise lost data.">Fix DF</label><input type="checkbox" data-dkey="adsb.fix_df" ${dc.fix_df?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Enable decoding of DF24 Comm-D extended length messages used for advanced aircraft data exchange (ELM/EHS).">DF24 (Comm-D)</label><input type="checkbox" data-dkey="adsb.enable_df24" ${dc.enable_df24?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Enable decoding of legacy Mode A (squawk code) and Mode C (altitude) transponder signals at 1090 MHz.">Mode A/C</label><input type="checkbox" data-dkey="adsb.mode_ac" ${dc.mode_ac?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Automatically enable Mode A/C decoding only when ADS-B traffic is detected nearby, reducing false positives from noise.">Mode A/C auto</label><input type="checkbox" data-dkey="adsb.mode_ac_auto" ${dc.mode_ac_auto?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Recover messages with CRC errors by trying known ICAO addresses as error syndromes. Improves message count for already-seen aircraft.">CRC Rescue</label><input type="checkbox" data-dkey="adsb.crc_rescue" ${dc.crc_rescue?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Prefer GNSS (GPS) altitude over barometric altitude in aircraft position reports when both are available.">Use GNSS alt</label><input type="checkbox" data-dkey="adsb.use_gnss" ${dc.use_gnss?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Enable high-resolution 12 MHz timestamps needed for multilateration (MLAT) position calculation by feeding networks like FlightAware.">MLAT timestamps</label><input type="checkbox" data-dkey="adsb.mlat" ${dc.mlat?'checked':''}></div>`;
        dhtml+=`<div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--border)"><strong style="color:var(--dim);font-size:12px">Adaptive Gain</strong></div>`;
        dhtml+=`<div class="field"><label title="Automatically adjust receiver gain based on the range of detected aircraft to optimize long-range reception.">Adaptive Range</label><input type="checkbox" data-dkey="adsb.adaptive_range" ${dc.adaptive_range?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Automatically reduce gain when strong signal bursts from nearby transmitters are detected, preventing receiver saturation.">Adaptive Burst</label><input type="checkbox" data-dkey="adsb.adaptive_burst" ${dc.adaptive_burst?'checked':''}></div>`;
        dhtml+=`<div class="field"><label title="Minimum gain value (in dB) the adaptive algorithm is allowed to set. Prevents the gain from dropping too low.">Min Gain (dB)</label><input type="number" step="0.1" data-dkey="adsb.adaptive_min_gain" value="${dc.adaptive_min_gain||0}"></div>`;
        dhtml+=`<div class="field"><label title="Maximum gain value (in dB) the adaptive algorithm is allowed to set. Use 99999 for no upper limit.">Max Gain (dB)</label><input type="number" step="0.1" data-dkey="adsb.adaptive_max_gain" value="${dc.adaptive_max_gain||99999}"></div>`;
        dhtml+=`<div class="field"><label title="Fraction of time (0.0–1.0) the adaptive gain algorithm actively adjusts. Lower values change gain less frequently, reducing instability.">Duty cycle</label><input type="number" step="0.01" data-dkey="adsb.adaptive_duty_cycle" value="${dc.adaptive_duty_cycle||0.5}"></div>`;
        dhtml+=`</div></div>`;}

        // FLARM decoder (includes keys)
        {const active=activeDecoders.has('flarm');
        const dc=decRes.flarm||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">🚩 FLARM Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Solo OGN</label><input type="checkbox" data-dkey="flarm.ogn_only" ${dc.ogn_only?'checked':''}></div>`;
        dhtml+=`<div class="field"><label>OGN Server</label><input type="text" data-dkey="flarm.ogn_server" value="${dc.ogn_server||''}"></div>`;
        dhtml+=`<div class="field"><label>OGN Port</label><input type="number" data-dkey="flarm.ogn_port" value="${dc.ogn_port||14580}"></div>`;
        dhtml+=`<div class="field"><label>OGN Station</label><input type="text" data-dkey="flarm.ogn_station" value="${dc.ogn_station||''}"></div>`;
        dhtml+=`<div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--border)"><strong style="color:var(--accent);font-size:13px">🔑 Encryption Keys</strong>
            <span class="badge ${dc.keys_loaded?'ok':'err'}" style="margin-left:8px">${dc.keys_loaded?'Loaded':'Not loaded'}</span></div>`;
        dhtml+=`<div class="field"><label>key_table (12×hex)</label><input type="text" data-dkey="flarm.key_table" value="${dc.key_table||''}" style="font-family:monospace;font-size:11px;letter-spacing:0.5px"></div>`;
        dhtml+=`<div class="field"><label>key2</label><input type="text" data-dkey="flarm.key2" value="${dc.key2||''}" style="font-family:monospace"></div>`;
        dhtml+=`<div class="field"><label>key3</label><input type="text" data-dkey="flarm.key3" value="${dc.key3||''}" style="font-family:monospace"></div>`;
        dhtml+=`<div class="field"><label>key4</label><input type="text" data-dkey="flarm.key4" value="${dc.key4||''}" style="font-family:monospace"></div>`;
        dhtml+=`<div class="field"><label>key5 (4×hex)</label><input type="text" data-dkey="flarm.key5" value="${dc.key5||''}" style="font-family:monospace"></div>`;
        dhtml+=`</div></div>`;}

        // ACARS decoder
        {const active=activeDecoders.has('acars');
        const dc=decRes.acars||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">📡 ACARS Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Channels</label><span style="color:var(--dim);font-size:12px">${(dc.channels||[]).map(f=>(f/1e6).toFixed(3)+' MHz').join(', ')}</span></div>`;
        dhtml+=`</div></div>`;}

        // VDL2 decoder
        {const active=activeDecoders.has('vdl2');
        const dc=decRes.vdl2||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">📡 VDL2 Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Squelch (dBFS)</label><input type="number" step="1" data-dkey="vdl2.squelch_level" value="${dc.squelch_level||-32}"></div>`;
        dhtml+=`<div class="field"><label>Channels</label><span style="color:var(--dim);font-size:12px">${(dc.channels||[]).map(f=>(f/1e6).toFixed(3)+' MHz').join(', ')}</span></div>`;
        dhtml+=`</div></div>`;}

        // Radiosonde decoder
        {const active=activeDecoders.has('radiosonde');
        const dc=decRes.radiosonde||{};
        const fm=dc.freq_mode||0;
        const cf=dc.center_freq||403000000;
        // Build freq mode value: 0=fixed+freq, 1=scan
        let fmVal='scan';
        if(fm===0){fmVal='f'+cf;}
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">🎈 Radiosonde Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Frequency</label><select id="sonde-freq-mode" onchange="sondeFreqChanged(this)">`;
        dhtml+=`<option value="f401000000"${fmVal==='f401000000'?' selected':''}>401 MHz (399.8–402.2)</option>`;
        dhtml+=`<option value="f403000000"${fmVal==='f403000000'?' selected':''}>403 MHz (401.8–404.2)</option>`;
        dhtml+=`<option value="f405000000"${fmVal==='f405000000'?' selected':''}>405 MHz (403.8–406.2)</option>`;
        dhtml+=`<option value="scan"${fm===1?' selected':''}>Scan 400–406 MHz (auto)</option>`;
        dhtml+=`</select></div>`;
        dhtml+=`<div class="field" id="sonde-dwell-row" style="${fm===1?'':'display:none'}"><label>Dwell time (sec)</label><input type="number" min="3" max="30" step="1" data-dkey="radiosonde.scan_dwell_sec" value="${dc.scan_dwell_sec||5}"></div>`;
        dhtml+=`<input type="number" id="sonde-freq-mode-val" data-dkey="radiosonde.freq_mode" value="${fm}" style="display:none">`;
        dhtml+=`<input type="number" id="sonde-center-freq-val" data-dkey="radiosonde.center_freq" value="${cf}" style="display:none">`;
        dhtml+=`<div class="field"><label>SondeHub upload</label><input type="checkbox" data-dkey="radiosonde.sondehub_upload" ${dc.sondehub_upload?'checked':''}></div>`;
        dhtml+=`<div class="field"><label>radiosondy.info</label><input type="checkbox" data-dkey="radiosonde.radiosondy_upload" ${dc.radiosondy_upload?'checked':''}></div>`;
        dhtml+=`<div class="field"><label>wettersonde.net</label><input type="checkbox" data-dkey="radiosonde.wettersonde_upload" ${dc.wettersonde_upload?'checked':''}></div>`;
        dhtml+=`<div class="field"><label>Callsign</label><input type="text" data-dkey="radiosonde.callsign" value="${dc.callsign||''}"></div>`;
        dhtml+=`</div></div>`;}

        // POCSAG decoder
        {const active=activeDecoders.has('pocsag');
        const dc=decRes.pocsag||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">📟 POCSAG Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Output enabled</label><input type="checkbox" data-dkey="pocsag.output_enabled" ${dc.output_enabled?'checked':''}></div>`;
        dhtml+=`<div class="field"><label>Channels</label><span style="color:var(--dim);font-size:12px">${(dc.channels||[]).map(f=>(f/1e6).toFixed(3)+' MHz').join(', ')}</span></div>`;
        dhtml+=`</div></div>`;}

        // GSM decoder
        {const active=activeDecoders.has('gsm');
        const dc=decRes.gsm||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">📶 GSM Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Output enabled</label><input type="checkbox" data-dkey="gsm.output_enabled" ${dc.output_enabled?'checked':''}></div>`;
        dhtml+=`<div class="field"><label>ARFCN Freq (Hz)</label><input type="number" data-dkey="gsm.arfcn_freq" value="${dc.arfcn_freq||947000000}"></div>`;
        dhtml+=`</div></div>`;}

        // LTE decoder
        {const active=activeDecoders.has('lte');
        const dc=decRes.lte||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">📶 LTE Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Output enabled</label><input type="checkbox" data-dkey="lte.output_enabled" ${dc.output_enabled?'checked':''}></div>`;
        dhtml+=`<div class="field"><label>Hop enabled</label><input type="checkbox" data-dkey="lte.hop_enabled" ${dc.hop_enabled?'checked':''}></div>`;
        dhtml+=`</div></div>`;}

        // IoT 868 decoder
        {const active=activeDecoders.has('iot868');
        const dc=decRes.iot868||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">🌡️ IoT 868 Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Output enabled</label><input type="checkbox" data-dkey="iot868.output_enabled" ${dc.output_enabled?'checked':''}></div>`;
        dhtml+=`</div></div>`;}

        // FANET decoder
        {const active=activeDecoders.has('fanet');
        const dc=decRes.fanet||{};
        dhtml+=`<div class="card" style="${active?'':'opacity:0.5;pointer-events:none'}"><h3 class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">🚩 FANET Decoder${active?'':' <span style="font-size:11px;color:var(--dim)">(no dongle)</span>'}</h3><div>`;
        dhtml+=`<div class="field"><label>Output enabled</label><input type="checkbox" data-dkey="fanet.output_enabled" ${dc.output_enabled?'checked':''}></div>`;
        dhtml+=`</div></div>`;}

        document.getElementById('decoder-configs').innerHTML=dhtml;
    }catch(e){
        document.getElementById('decoder-configs').innerHTML=`<div class="card"><h3>📡 SDR Receivers</h3><p style="color:var(--danger)">Error: ${e}</p></div>`;
    }
}

async function loadConfig(){
    try{
        const [cfgRes,decRes]=await Promise.all([
            fetch('/api/config').then(r=>r.json()),
            fetch('/api/decoders').then(r=>r.json())
        ]);
        cfg=cfgRes;
        decoderCfg=decRes;
        renderConfigForm();
    }catch(e){document.getElementById('config-form').innerHTML=`<p style="color:var(--danger)">Error: ${e}</p>`}
}

// ---- Security: Input sanitization ----
const DANGEROUS_CHARS=/[`$!|;&()<>'"]/;
const DANGEROUS_PATTERNS=/(\.\.|\/\/|\\\\|%2e|%00|<script|javascript:|onerror|onload)/i;

let _agRunning=false;
function showStatus(msg,ok,timeout){
    const el=document.getElementById('save-status');
    if(!el)return;
    el.textContent=msg;
    el.style.color=ok?'#66bb6a':'#f44336';
    el.style.fontSize='12px';
    el.style.display='inline';
    if(timeout!==0)setTimeout(()=>{el.style.color='var(--dim)';},timeout||8000);
}
function _rxNoise(stats,serial){
    if(!stats.rx_noise)return null;
    return stats.rx_noise.find(n=>n.serial===serial)||null;
}
async function autoGain(serial){
    if(_agRunning){showStatus('Auto-gain already running',false);return;}
    let rx=null;
    try{
        const rxRes=await fetch('/api/receivers').then(r=>r.json());
        rx=rxRes.receivers.find(r=>r.serial===serial||r.serial_actual===serial);
    }catch(e){showStatus('Failed to load receiver data',false);return;}
    if(!rx||!rx.gain_list||rx.gain_list.length<2){showStatus('No gain table for '+serial,false);return;}
    _agRunning=true;
    const isAdsb=(rx.role==='adsb');
    const btn=document.getElementById('ag_'+serial);
    if(btn)btn.disabled=true;
    const steps=rx.gain_list.length;
    const results=[];
    let bestStep=0,bestScore=-999;
    showStatus(`Auto-gain: testing ${steps} steps for ${serial}... (${isAdsb?'msg count':'noise floor'})`,true);

    for(let i=0;i<steps;i++){
        if(btn)btn.textContent=`⏳ ${i+1}/${steps}`;
        try{
            await fetch('/api/receivers/setgain',{method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({serial:serial,step:i})});
            const s1=await fetch('/api/stats/quick').then(r=>r.json());
            await new Promise(r=>setTimeout(r,2000));
            const s2=await fetch('/api/stats/quick').then(r=>r.json());

            if(isAdsb){
                const msgs=s2.demod_total-s1.demod_total;
                results.push({step:i,gain:rx.gain_list[i],msgs,noise:0});
                if(msgs>bestScore){bestScore=msgs;bestStep=i;}
            }else{
                const n1=_rxNoise(s1,rx.serial_actual||serial);
                const n2=_rxNoise(s2,rx.serial_actual||serial);
                let noiseDb=-99;
                if(n1&&n2&&(n2.iq_count-n1.iq_count)>0){
                    const dSum=n2.iq_sum-n1.iq_sum;
                    const dCnt=n2.iq_count-n1.iq_count;
                    noiseDb=10*Math.log10(dSum/dCnt/32768);
                }
                results.push({step:i,gain:rx.gain_list[i],msgs:0,noise:noiseDb});
                if(noiseDb<-8&&i>=bestStep){bestScore=noiseDb;bestStep=i;}
            }
        }catch(e){results.push({step:i,gain:rx.gain_list[i],msgs:-1,noise:-99});}
    }

    await fetch('/api/receivers/setgain',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({serial:serial,step:bestStep})});

    const gainSel=document.getElementById('rx_gain_'+serial);
    if(gainSel){
        for(let j=0;j<gainSel.options.length;j++){
            if(Math.abs(parseFloat(gainSel.options[j].value)-rx.gain_list[bestStep])<0.05){
                gainSel.selectedIndex=j;break;}
        }
    }

    let summary=`Best: ${rx.gain_list[bestStep].toFixed(1)} dB. `;
    results.forEach(r=>{
        summary+=`${r.gain.toFixed(1)}=`;
        summary+=isAdsb?`${r.msgs}msg `:`${r.noise.toFixed(1)}dB `;
    });
    showStatus(summary,true,0);

    if(btn){btn.textContent='🔍 Auto';btn.disabled=false;}
    _agRunning=false;
}

async function saveConfig(){
    let hasError=false;
    document.querySelectorAll('[data-key]').forEach(el=>{
        const keys=el.dataset.key.split('.');
        let obj=cfg;
        for(let i=0;i<keys.length-1;i++){if(!obj[keys[i]])obj[keys[i]]={};obj=obj[keys[i]];}
        if(el.type==='checkbox'){obj[keys[keys.length-1]]=el.checked;}
        else if(el.type==='number'){obj[keys[keys.length-1]]=parseFloat(el.value)||0;}
        else{
            const raw=el.value;
            const skipSanitize=el.dataset.key==='adsbhub.ckey';
            if(!skipSanitize&&(DANGEROUS_CHARS.test(raw)||DANGEROUS_PATTERNS.test(raw))){
                el.style.borderColor='var(--danger)';
                hasError=true;
            }else{
                el.style.borderColor='';
                obj[keys[keys.length-1]]=raw;
            }
        }
    });
    // Collect decoder config changes (data-dkey attributes)
    let dcUpdate={};
    document.querySelectorAll('[data-dkey]').forEach(el=>{
        const keys=el.dataset.dkey.split('.');
        let obj=dcUpdate;
        for(let i=0;i<keys.length-1;i++){if(!obj[keys[i]])obj[keys[i]]={};obj=obj[keys[i]];}
        if(el.type==='checkbox'){obj[keys[keys.length-1]]=el.checked;}
        else if(el.type==='number'){obj[keys[keys.length-1]]=parseFloat(el.value)||0;}
        else{obj[keys[keys.length-1]]=el.value;}
    });
    if(hasError){
        document.getElementById('save-status').textContent='❌ Forbidden characters in highlighted fields';
        document.getElementById('save-status').style.color='var(--danger)';
        return;
    }
    document.getElementById('save-status').textContent='Saving...';
    document.getElementById('save-status').style.color='var(--dim)';
    try{
        // Save receiver gain changes
        const gainEls=document.querySelectorAll('[id^="rx_gain_"]');
        for(const gel of gainEls){
            const serial=gel.id.replace('rx_gain_','');
            const gain=parseFloat(gel.value)||40.0;
            let role='none',ppm=0;
            try{const rxRes=await fetch('/api/receivers').then(r=>r.json());
            const rx=rxRes.receivers.find(r=>r.serial===serial||r.serial_actual===serial);
            if(rx){role=rx.role;ppm=rx.ppm||0;}}catch(e){}
            if(role!=='none'){
                await fetch('/api/receivers/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serial:serial,role:role,gain:gain,ppm:ppm})});
            }
        }
        // Save decoder configs
        if(Object.keys(dcUpdate).length>0){
            await fetch('/api/decoders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dcUpdate)});
        }
        // Save general config
        const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
        const j=await r.json();
        if(j.error){document.getElementById('save-status').textContent='❌ '+j.error;document.getElementById('save-status').style.color='var(--danger)';return;}
        document.getElementById('save-status').textContent='✅ Configuration saved and applied';document.getElementById('save-status').style.color='var(--ok)';
        setTimeout(()=>{document.getElementById('save-status').textContent='';loadConfig();},3000);
    }catch(e){document.getElementById('save-status').textContent='❌ Error: '+e;}
}

async function calibratePPM(serial){
    const btn=document.getElementById('cal_btn_'+serial);
    const ppmInput=document.getElementById('rx_ppm_'+serial);
    const status=document.getElementById('cal_status_'+serial);
    if(!btn||!status)return;
    btn.disabled=true;
    const oldText=btn.innerHTML;
    btn.innerHTML='⏳ Scanning...';
    btn.style.color='var(--warn)';
    status.textContent='Stopping receiver, scanning GSM 920-960 MHz...';
    status.style.color='var(--dim)';
    try{
        const resp=await fetch('/api/calibrate-ppm',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({serial:serial})
        });
        const data=await resp.json();
        if(data.ok){
            if(ppmInput)ppmInput.value=data.ppm;
            status.innerHTML=`✅ Calibrated: <b>${data.old_ppm} → ${data.ppm} ppm</b> (offset ${data.offset>=0?'+':''}${data.offset.toFixed(1)}, RMS ${data.rms.toFixed(2)}, ${data.samples} samples)`+(data.warning?` ⚠️ ${data.warning}`:'');
            status.style.color='var(--ok)';
        }else{
            status.textContent='❌ '+data.error;
            status.style.color='var(--danger)';
        }
    }catch(e){
        status.textContent='❌ Network error: '+e.message;
        status.style.color='var(--danger)';
    }
    btn.innerHTML=oldText;
    btn.style.color='var(--accent)';
    btn.disabled=false;
}

loadConfig();
fetch('/api/status').then(r=>r.json()).then(d=>{const b=document.getElementById('ver-badge');if(b&&d.version)b.textContent='v'+d.version;}).catch(()=>{});
</script>
