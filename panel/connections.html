<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dump1090-gg — Connections</title>
<style>
:root{--bg:#0a0a1a;--card:#141428;--border:#2a2a4a;--text:#d0d0d0;--dim:#888;
--accent:#4fc3f7;--danger:#ff4444;--warn:#ffaa00;--link:#44aaff;--ok:#00cc44;
--head:#1a1a2e;--input-bg:#0e0e22;--hover:#1e1e3a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
nav{background:var(--head);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
nav h1{font-size:18px;color:var(--accent);white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--dim);transition:.2s;font-size:13px;user-select:none;text-decoration:none}
.tabs a:hover{background:var(--hover);color:var(--text)}
.tabs a.active{background:var(--accent);color:#000;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:#003322;color:var(--ok)}
.badge.warn{background:#332200;color:var(--warn)}
.badge.err{background:#330000;color:var(--danger)}
.badge.info{background:#002244;color:var(--link)}
.main{padding:16px;max-width:1600px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:20px}
.port-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.port-card h4{color:var(--accent);margin-bottom:10px;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.port-card h4 .port-num{font-family:'Cascadia Code','Fira Code',monospace;font-size:15px;color:var(--ok)}
.port-card h4 .count{color:var(--dim);font-size:12px}
.client-list{list-style:none;padding:0;margin:0}
.client-list li{padding:5px 8px;font-size:12px;font-family:'Cascadia Code','Fira Code',monospace;border-bottom:1px solid var(--border);color:var(--text);display:flex;justify-content:space-between;align-items:center}
.client-list li:last-child{border-bottom:none}
.client-list li:hover{background:var(--hover)}
.client-addr{color:var(--link)}
.no-clients{color:var(--dim);font-size:12px;font-style:italic;padding:6px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex-shrink:0}
.dot.green{background:var(--ok)}.dot.red{background:var(--danger)}.dot.yellow{background:var(--warn)}.dot.gray{background:#666}
.section-title{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.section-title:first-child{margin-top:0}
.summary{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;gap:24px;flex-wrap:wrap;font-size:13px}
.summary .stat{display:flex;flex-direction:column;align-items:center}
.summary .stat .val{font-size:22px;font-weight:700;color:var(--accent)}
.summary .stat .lbl{color:var(--dim);font-size:11px;text-transform:uppercase}
</style>
</head>
<body>
<nav>
<h1>✈ dump1090-gg-light</h1>
<div class="tabs">
<a href="/">⚙️ Config</a>
<a href="/status.html">📡 Status</a>
<a class="active" href="/connections.html">🔌 Connections</a>
<a href="/logs.html">📋 Logs</a>
<a href="/messages.html">📨 Messages</a>
<a href="/aircraft.html">✈️ Aircraft</a>
<a href="/devices.html">📻 Devices</a>
</div>
<span id="ver-badge" style="margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap;padding:2px 8px;border:1px solid var(--border);border-radius:10px" title="dump1090-gg version">v…</span>
</nav>

<div class="main">
<div id="conn-content"><p style="color:var(--dim)">Loading...</p></div>
</div>

<script>
async function loadConnections(){
    try{
        const r=await fetch('/api/connections');
        const d=await r.json();

        let totalClients=0, totalServices=0, totalListeners=0;
        for(const s of d.services){
            totalServices++;
            totalListeners+=s.listeners?s.listeners.length:0;
            totalClients+=s.connections||0;
        }

        let html=`<div class="summary">
            <div class="stat"><span class="val">${totalServices}</span><span class="lbl">Services</span></div>
            <div class="stat"><span class="val">${totalListeners}</span><span class="lbl">Listening ports</span></div>
            <div class="stat"><span class="val">${totalClients}</span><span class="lbl">Connected clients</span></div>
        </div>`;

        // Group: output services, input services
        const outputs=d.services.filter(s=>s.descr.toLowerCase().includes('output'));
        const inputs=d.services.filter(s=>s.descr.toLowerCase().includes('input'));
        const others=d.services.filter(s=>!s.descr.toLowerCase().includes('output')&&!s.descr.toLowerCase().includes('input'));

        function renderGroup(title,svcs){
            if(!svcs.length) return '';
            let h=`<div class="section-title">${title} (${svcs.length})</div><div class="grid">`;
            for(const s of svcs){
                const ports=(s.listeners||[]).join(', ')||'—';
                const nc=s.connections||0;
                const hasClients=s.clients&&s.clients.length>0;
                h+=`<div class="port-card">
                    <h4>
                        <span><span class="dot ${nc>0?'green':'gray'}"></span>${s.descr}</span>
                        <span class="count">${nc} client${nc!==1?'s':''}</span>
                    </h4>
                    <div style="margin-bottom:8px;font-size:12px;color:var(--dim)">
                        Port: <span class="port-num">${ports}</span>
                    </div>`;
                if(hasClients){
                    h+='<ul class="client-list">';
                    for(const c of s.clients){
                        h+=`<li><span class="client-addr">${c.addr||'?'}</span>
                            <span style="color:var(--dim)">${c.flags||''}</span></li>`;
                    }
                    h+='</ul>';
                } else {
                    h+=`<div class="no-clients">${nc>0?nc+' connected clients':'No connected clients'}</div>`;
                }
                h+='</div>';
            }
            h+='</div>';
            return h;
        }

        html+=renderGroup('Output Ports',outputs);
        html+=renderGroup('Input Ports',inputs);
        html+=renderGroup('Other Services',others);

        document.getElementById('conn-content').innerHTML=html;
    }catch(e){document.getElementById('conn-content').innerHTML=`<p style="color:var(--danger)">Error: ${e}</p>`}
}

loadConnections();
setInterval(loadConnections,3000);
fetch('/api/status').then(r=>r.json()).then(d=>{const b=document.getElementById('ver-badge');if(b&&d.version)b.textContent='v'+d.version;}).catch(()=>{});
</script>
</body>
</html>
