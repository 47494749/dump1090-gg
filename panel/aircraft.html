function calcDist(lat,lon){
    if(stationLat==null||stationLon==null||lat==null||lon==null)return null;
    const R=6371000;
    const dLat=(lat-stationLat)*Math.PI/180;
    const dLon=(lon-stationLon)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(stationLat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(m){
    if(m==null)return '';
    if(m<1000)return Math.round(m)+'m';
    return Math.round(m/1000)+'km';
}

function escapeHtml(s){
    if(typeof s!=='string')return s;
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const emergencySquawks=['7500','7600','7700'];
function isEmergencySquawk(sq){ return sq && emergencySquawks.includes(String(sq)); }
function getSquawkTitle(sq){
    if(!sq)return '';
    const s=String(sq).padStart(4,'0');
    if(squawkMeanings[s]) return squawkMeanings[s];
    const n=parseInt(s,8);
    for(const r of squawkRanges){if(n>=r.lo && n<=r.hi) return r.d+' ('+s+')';}
    return 'Code '+s;
}
function sortAC(key){if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=1;}renderAC();}

function sevSpan(v){
    if(!v||v==='nil')return'<span class="msev-nil">NIL</span>';
    return`<span class="msev-${v}">${v.toUpperCase()}</span>`;
}
function hasMeteo(a){
    return a.temperature!=null||a.pressure!=null||a.humidity!=null||a.turbulence!=null||
        a.wind_speed!=null||a.mhar_turbulence!=null||a.mhar_windshear!=null||
        a.mhar_microburst!=null||a.mhar_icing!=null||a.mhar_wake!=null||
        a.mhar_temperature!=null||a.mhar_pressure!=null||a.mhar_radio_height!=null||
        a.oat!=null||a.tat!=null||a.wd_speed!=null;
}
function getMeteoIcon(a){
    if(!hasMeteo(a))return'';
    let rows=[];
    // BDS 4,4 — MRAR
    const hasMRAR=a.temperature!=null||a.pressure!=null||a.humidity!=null||a.turbulence!=null||a.wind_speed!=null;
    if(hasMRAR){
        rows.push('<span class="mh">MRAR (BDS 4,4)</span>');
        if(a.wind_speed!=null||a.wind_dir!=null)
            rows.push(`<span class="ml">Wind</span><span class="mv">${a.wind_speed!=null?Math.round(a.wind_speed)+' kt':''} ${a.wind_dir!=null?'@ '+a.wind_dir.toFixed(0)+'°':''}</span>`);
        if(a.temperature!=null)
            rows.push(`<span class="ml">SAT</span><span class="mv">${a.temperature.toFixed(1)} °C</span>`);
        if(a.pressure!=null)
            rows.push(`<span class="ml">Pressure</span><span class="mv">${Math.round(a.pressure)} hPa</span>`);
        if(a.humidity!=null)
            rows.push(`<span class="ml">Humidity</span><span class="mv">${a.humidity.toFixed(1)} %</span>`);
        if(a.turbulence!=null)
            rows.push(`<span class="ml">Turbulence</span><span class="mv">${sevSpan(a.turbulence)}</span>`);
        if(a.mrar_source)
            rows.push(`<span class="ml">Nav source</span><span class="mv">${escapeHtml(a.mrar_source.toUpperCase())}</span>`);
    }
    // BDS 4,5 — MHAR
    const hasMHAR=a.mhar_turbulence!=null||a.mhar_windshear!=null||a.mhar_microburst!=null||a.mhar_icing!=null||a.mhar_wake!=null||a.mhar_temperature!=null||a.mhar_pressure!=null||a.mhar_radio_height!=null;
    if(hasMHAR){
        rows.push('<span class="mh">MHAR (BDS 4,5)</span>');
        if(a.mhar_turbulence!=null)
            rows.push(`<span class="ml">Turbulence</span><span class="mv">${sevSpan(a.mhar_turbulence)}</span>`);
        if(a.mhar_windshear!=null)
            rows.push(`<span class="ml">Windshear</span><span class="mv">${sevSpan(a.mhar_windshear)}</span>`);
        if(a.mhar_microburst!=null)
            rows.push(`<span class="ml">Microburst</span><span class="mv">${sevSpan(a.mhar_microburst)}</span>`);
        if(a.mhar_icing!=null)
            rows.push(`<span class="ml">Icing</span><span class="mv">${sevSpan(a.mhar_icing)}</span>`);
        if(a.mhar_wake!=null)
            rows.push(`<span class="ml">Wake vortex</span><span class="mv">${sevSpan(a.mhar_wake)}</span>`);
        if(a.mhar_temperature!=null)
            rows.push(`<span class="ml">SAT</span><span class="mv">${a.mhar_temperature.toFixed(1)} °C</span>`);
        if(a.mhar_pressure!=null)
            rows.push(`<span class="ml">Avg pressure</span><span class="mv">${Math.round(a.mhar_pressure)} hPa</span>`);
        if(a.mhar_radio_height!=null)
            rows.push(`<span class="ml">Radio height</span><span class="mv">${a.mhar_radio_height} ft</span>`);
    }
    // Derived wind & temps
    const hasDerived=a.oat!=null||a.tat!=null||a.wd_speed!=null;
    if(hasDerived){
        rows.push('<span class="mh">Derived</span>');
        if(a.wd_speed!=null)
            rows.push(`<span class="ml">Wind</span><span class="mv">${Math.round(a.wd_speed)} kt ${a.wd_dir!=null?'@ '+a.wd_dir.toFixed(0)+'°':''}${a.wd_alt!=null?' FL'+Math.round(a.wd_alt/100):''}</span>`);
        if(a.oat!=null)
            rows.push(`<span class="ml">OAT</span><span class="mv">${a.oat.toFixed(1)} °C</span>`);
        if(a.tat!=null)
            rows.push(`<span class="ml">TAT</span><span class="mv">${a.tat.toFixed(1)} °C</span>`);
    }
    // Pick icon color based on severity
    let col='var(--ok)',icon='🌤️';
    const sevs=[a.turbulence,a.mhar_turbulence,a.mhar_windshear,a.mhar_microburst,a.mhar_icing,a.mhar_wake];
    if(sevs.some(s=>s==='severe')){col='var(--danger)';icon='⛈️';}
    else if(sevs.some(s=>s==='moderate')){col='var(--warn)';icon='🌧️';}
    else if(sevs.some(s=>s==='light')){col='var(--ok)';icon='🌥️';}
    return `<span class="tt" style="cursor:help"><span style="font-size:14px">${icon}</span><span class="ttbox meteo-tip"><div class="mg">${rows.join('')}</div></span></span>`;
}

    {icon:'📍',label:'Static Object',col:'#666666'},
];
function getFlarmTypeIcon(a){
    const ft=a.flarm_type;
    if(ft==null||ft===0)return '';
    const info=flarmTypeInfo[ft]||flarmTypeInfo[0];
    return `<span class="tt" style="cursor:default"><span style="font-size:15px" title="${info.label}">${info.icon}</span><span class="ttbox">${info.label}</span></span>`;
}

function getFanetExtra(a){
    if(!a.fanet_hw && !a.fanet_thermal) return '';
    let lines=[];
    if(a.fanet_hw){
        lines.push(`HW: dev=0x${a.fanet_hw.dev.toString(16).padStart(2,'0')}`);
        if(a.fanet_hw.uptime>0) lines.push(`Uptime: ${a.fanet_hw.uptime}min`);
        if(a.fanet_hw.rssi) lines.push(`RSSI: ${a.fanet_hw.rssi}dBm`);
    }
    if(a.fanet_thermal){
        const t=a.fanet_thermal;
        lines.push(`Thermal: ${t.climb>0?'+':''}${t.climb.toFixed(1)}m/s @${t.alt}m`);
        if(t.wind_spd>0) lines.push(`Wind: ${t.wind_spd.toFixed(0)}km/h @${t.wind_hdg.toFixed(0)}°`);
        lines.push(`Conf: ${t.conf}/7`);
    }
    const tip=escapeHtml(lines.join(' | '));
    return ` <span class="tt" style="cursor:help;color:var(--dim);font-size:11px">ℹ️<span class="ttbox" style="white-space:pre-wrap;max-width:300px">${tip}</span></span>`;
}

function getSource(a){
    const cs=(a.flight||'').trim().toUpperCase();
    if(cs.startsWith('FLR'))return{label:'FLARM',bg:'rgba(0,200,100,0.18)',col:'#00cc66',title:'FLARM 868 MHz'};
    if(cs.startsWith('OGN'))return{label:'OGNTP',bg:'rgba(0,180,255,0.18)',col:'#00b4ff',title:'OGN-Tracker Protocol (868 MHz)'};
    if(cs.startsWith('FNT'))return{label:'FANET',bg:'rgba(180,0,255,0.18)',col:'#b44dff',title:'FANET LoRa 868.2 MHz'};
    if(cs.startsWith('PAW'))return{label:'PAW',bg:'rgba(255,100,200,0.18)',col:'#ff64c8',title:'PilotAware P3I (869.525 MHz)'};
    if(cs.startsWith('ADL'))return{label:'ADS-L',bg:'rgba(255,165,0,0.18)',col:'#ffa500',title:'ADS-L SRD-860 (868 MHz)'};
    // If aircraft has a FLARM type set, it came from FLARM/FANET/OGN even if callsign is a pilot name
    if(a.flarm_type)return{label:'FANET',bg:'rgba(180,0,255,0.18)',col:'#b44dff',title:'FANET LoRa 868.2 MHz (named)'};
    // Use datasource (position data source) if available — this tells us WHERE the position came from
    const ds=(a.datasource||'').toLowerCase();
    if(ds==='mlat')return{label:'MLAT',bg:'rgba(255,120,0,0.18)',col:'#ff7800',title:'Terrestrial MLAT (multilateration)'};
    if(ds==='tisb')return{label:'TIS-B',bg:'rgba(255,180,0,0.18)',col:'#ffb400',title:'TIS-B (ground uplink)'};
    if(ds==='adsr')return{label:'ADS-R',bg:'rgba(150,100,255,0.18)',col:'#9664ff',title:'ADS-R (rebroadcast)'};
    if(ds==='adsb'){
        // Distinguish ADS-B full from ADS-B Light:
        // ADS-B Light = has position but missing velocity (gs) or identification (flight)
        const hasVel=(a.gs!=null||a.tas!=null||a.ias!=null);
        const hasIdent=(a.flight!=null&&a.flight.trim()!=='');
        if(!hasVel&&!hasIdent)return{label:'ADS-L',bg:'rgba(79,195,247,0.10)',col:'#7ecbf0',title:'ADS-B Light (position only, no velocity/ident)'};
        if(!hasVel||!hasIdent)return{label:'ADS-L',bg:'rgba(79,195,247,0.10)',col:'#7ecbf0',title:'ADS-B Light (partial data)'};
        return{label:'ADS-B',bg:'rgba(79,195,247,0.15)',col:'#4fc3f7',title:'ADS-B (full)'};
    }
    // Fallback to address type when no position/datasource is available
    const t=(a.type||'adsb_icao').toLowerCase();
    if(t.startsWith('adsb'))return{label:'ADS-B',bg:'rgba(79,195,247,0.15)',col:'#4fc3f7',title:'ADS-B (no position yet)'};
    if(t.startsWith('adsr'))return{label:'ADS-R',bg:'rgba(150,100,255,0.18)',col:'#9664ff',title:'ADS-R (rebroadcast)'};
    if(t.startsWith('tisb'))return{label:'TIS-B',bg:'rgba(255,180,0,0.18)',col:'#ffb400',title:'TIS-B (uplink)'};
    if(t==='mode_s')return{label:'ModeS',bg:'rgba(120,120,120,0.18)',col:'#aaaaaa',title:'Mode S (no position)'};
    if(t==='mode_ac')return{label:'ModeA/C',bg:'rgba(100,100,100,0.15)',col:'#888',title:'Mode A/C only'};
    return{label:'?',bg:'rgba(80,80,80,0.15)',col:'#666',title:t||'unknown'};
}

function isMilitary(a){
    const n=parseInt(a.hex,16);
    if(!isNaN(n)){
        if(n>=0xAE0000&&n<=0xAFFFFF)return true; // US military
        if(n>=0x43C000&&n<=0x43CFFF)return true;  // UK RAF/RN
        if(n>=0x3B0000&&n<=0x3BFFFF)return true;  // French military (FAF sub-range)
        if(n>=0x7C7000&&n<=0x7C7FFF)return true;  // Australian military (RAAF)
        if(n>=0x710000&&n<=0x71FFFF)return true;  // Turkish military (ThAF sub-range)
    }
    const sq=String(a.squawk||'');
    if(/^700[1-7]$/.test(sq))return true;
    // Known military callsign prefixes (Italian AMI, NATO exercise, etc.)
    const cs=String(a.flight||'').trim().toUpperCase();
    if(/^(SPARO|GRIFONE|FALCO|AQUILA|CORVO|VIPER|COBRA|SHARK|LYNX|BOXER|ATLAS|AWACS|NATO|REAPER|PREDATOR|GHOST|SPECTR|SENTRY|TALON|ZEUS|MARS|ARES|TITAN)\d/.test(cs))return true;
    if(icaoCache[a.hex]){const ow=(icaoCache[a.hex].registered_owner||'').toLowerCase();
        if(/air force|navy|army|milit|luftwaffe|marine nationale|aeronautica|bundeswehr|ministry of defen|royal air force/.test(ow))return true;}
    if(a.df19)return true;
    return false;
}

function renderAC(){
    acData.sort((a,b)=>{
        let va,vb;
        if(sortKey==='dist'){va=calcDist(a.lat,a.lon);vb=calcDist(b.lat,b.lon);}
        else{va=a[sortKey];vb=b[sortKey];}
        if(va==null)va=Infinity;if(vb==null)vb=Infinity;
        if(typeof va==='number'&&typeof vb==='number')return(va-vb)*sortDir;
        return String(va).localeCompare(String(vb))*sortDir;
    });
    let html='';
    for(const a of acData){
        let flags='';
        const isGhost=!a.flight&&a.lat==null&&a.lon==null;
        if(isGhost)flags+=`<span class="badge" style="background:rgba(150,150,150,0.3);color:#888" title="ICAO only — no ADS-B data">👻</span> `;
        if(isMilitary(a))flags+=`<span class="badge" style="background:rgba(255,160,0,0.25);color:#ffa000" title="Probable military aircraft">🎖️</span> `;
        if(a.gps_integrity==='suspect')flags+=`<span class="badge err">GPS!</span> `;
        else if(a.gps_integrity==='degraded')flags+=`<span class="badge warn">GPS↓</span> `;
        if(a.circling)flags+=`<span class="badge info">🔄</span> `;
        if(a.alert)flags+=`<span class="badge err">ALERT</span> `;
        const sqStr=a.squawk||'';
        const sqEmerg=isEmergencySquawk(sqStr);
        const sqTitle=getSquawkTitle(sqStr);
        const rowStyle=sqEmerg?'background:rgba(255,60,60,0.15)':'';
        const sqStyle=sqEmerg?'color:var(--danger);font-weight:bold':'';
        const safeHex=escapeHtml(a.hex||'');
        const safeFlight=escapeHtml((a.flight||'').trim());
        const safeSqStr=escapeHtml(sqStr);
        const safeSqTitle=escapeHtml(sqTitle);
        const safeCat=escapeHtml(a.category||'');
        if(sqEmerg)flags+=`<span class="badge err">${escapeHtml(squawkMeanings[String(sqStr)]||'EMERG')}</span> `;
        const ghostStyle=isGhost?'opacity:0.45':'';
        html+=`<tr style="${rowStyle}${ghostStyle}" data-icao="${safeHex}">
            <td class="icao-link" style="font-family:monospace;color:var(--accent)" onclick="lookupICAO('${safeHex}')">${safeHex}</td>
            <td><strong>${safeFlight}</strong>${getFanetExtra(a)}</td>
            <td style="${sqStyle}" title="${safeSqTitle}">${safeSqStr}</td>
            <td>${a.alt_baro!=null?a.alt_baro:''}</td>
            <td>${a.gs!=null?Math.round(a.gs):''}</td>
            <td>${a.track!=null?Math.round(a.track)+'°':''}</td>
            <td>${a.lat!=null?a.lat.toFixed(4):''}</td>
            <td>${a.lon!=null?a.lon.toFixed(4):''}</td>
            <td>${fmtDist(calcDist(a.lat,a.lon))}</td>
            <td>${a.baro_rate!=null?a.baro_rate:''}</td>
            <td>${a.flarm_type?getFlarmTypeIcon(a):safeCat}</td>
            <td>${a.rssi!=null?a.rssi.toFixed(1):''}</td>
            <td>${a.messages||''}</td>
            <td>${a.seen!=null?a.seen.toFixed(1)+'s':''}</td>
            <td>${(()=>{const s=getSource(a);return`<span class="tt" style="display:inline-block"><span style="display:inline-block;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:600;background:${s.bg};color:${s.col};cursor:default">${escapeHtml(s.label)}</span><span class="ttbox">${escapeHtml(s.title)}</span></span>`;})()}</td>
            <td>${flags}${getMeteoIcon(a)}</td>
        </tr>`;
    }
    document.getElementById('ac-body').innerHTML=html;
    if(selectedIcao){const sr=document.querySelector(`tr[data-icao="${selectedIcao}"]`);if(sr)sr.classList.add('ac-row-selected');}
}

function closeIcaoPanel(){document.getElementById('icao-side-panel').classList.remove('show');selectedIcao=null;document.querySelectorAll('.ac-row-selected').forEach(r=>r.classList.remove('ac-row-selected'));}

async function lookupICAO(hex){
    if(!hex)return;
    if(!/^[0-9a-fA-F]{1,6}$/.test(hex))return;
    selectedIcao=hex;
    document.querySelectorAll('.ac-row-selected').forEach(r=>r.classList.remove('ac-row-selected'));
    const row=document.querySelector(`tr[data-icao="${hex}"]`);
    if(row)row.classList.add('ac-row-selected');
    const panel=document.getElementById('icao-side-panel');
    const title=document.getElementById('icao-panel-title');
    const body=document.getElementById('icao-panel-body');
    title.textContent=`✈ ${hex.toUpperCase()}`;
    panel.classList.add('show');

    if(icaoCache[hex]){
        renderIcaoInfo(hex,icaoCache[hex]);
        return;
    }

    // 1) adsbdb.com
    body.innerHTML='<div style="color:var(--dim);text-align:center;padding:20px">⏳ 1/3 adsbdb.com...</div>';
    try{
        const r=await fetch(`https://api.adsbdb.com/v0/aircraft/${hex}`);
        const d=await r.json();
        if(d.response&&d.response.aircraft){
            const info=d.response.aircraft;
            info._src='adsbdb.com';
            icaoCache[hex]=info;
            renderIcaoInfo(hex,info);
            return;
        }
    }catch(e){}

    // 2) hexdb.io
    body.innerHTML='<div style="color:var(--dim);text-align:center;padding:20px">⏳ 2/3 hexdb.io...</div>';
    try{
        const r=await fetch(`https://hexdb.io/api/v1/aircraft/${hex}`);
        if(r.ok){
            const d=await r.json();
            if(d.Registration||d.RegisteredOwners||d.Type){
                const info={
                    registration:d.Registration||'',
                    registered_owner:d.RegisteredOwners||'',
                    type:d.Type||'',
                    manufacturer:d.Manufacturer||'',
                    icao_type:d.ICAOTypeCode||'',
                    registered_owner_country_name:'',
                    url_photo:'',url_photo_thumbnail:'',
                    _src:'hexdb.io'
                };
                icaoCache[hex]=info;
                renderIcaoInfo(hex,info);
                return;
            }
        }
    }catch(e){}

    // 3) opensky-network.org
    body.innerHTML='<div style="color:var(--dim);text-align:center;padding:20px">⏳ 3/3 opensky-network.org...</div>';
    try{
        const r=await fetch(`https://opensky-network.org/api/metadata/aircraft/icao/${hex}`);
        if(r.ok){
            const d=await r.json();
            if(d.registration||d.owner||d.model){
                const info={
                    registration:d.registration||'',
                    registered_owner:d.owner||d.operatorCallsign||'',
                    type:d.model||'',
                    manufacturer:d.manufacturerName||'',
                    icao_type:d.typecode||'',
                    registered_owner_country_name:d.country||'',
                    url_photo:'',url_photo_thumbnail:'',
                    _src:'opensky-network.org'
                };
                icaoCache[hex]=info;
                renderIcaoInfo(hex,info);
                return;
            }
        }
    }catch(e){}

    icaoCache[hex]={_src:'none'};
    body.innerHTML='<div style="color:var(--dim);text-align:center;padding:20px">No information found for <strong>'+hex.toUpperCase()+'</strong><br><span style="font-size:11px;margin-top:6px;display:block">Searched on: adsbdb.com, hexdb.io, opensky-network.org</span></div>';
}

function renderIcaoInfo(hex,info){
    const body=document.getElementById('icao-panel-body');
    const title=document.getElementById('icao-panel-title');
    const reg=escapeHtml(info.registration||'');
    const owner=escapeHtml(info.registered_owner||info.owner||'');
    const type=escapeHtml(info.type||'');
    const mfr=escapeHtml(info.manufacturer||'');
    const icaoType=escapeHtml(info.icao_type||'');
    const country=escapeHtml(info.registered_owner_country_name||'');
    const rawUrl=info.url_photo||info.image||'';
    const rawThumb=info.url_photo_thumbnail||'';
    const url=(rawUrl&&/^https?:\/\//i.test(rawUrl))?escapeHtml(rawUrl):'';
    const urlThumb=(rawThumb&&/^https?:\/\//i.test(rawThumb))?escapeHtml(rawThumb):'';
    const src=escapeHtml(info._src||'');
    if(reg||owner)title.textContent=`✈ ${(info.registration||hex.toUpperCase())} — ${(info.registered_owner||info.owner||'')}`;
    const isMil=/air force|navy|army|milit|luftwaffe|marine nationale|aeronautica|bundeswehr|ministry of defen|royal air force/.test((info.registered_owner||'').toLowerCase());
    const dbFields=[
        ['ICAO',escapeHtml(hex.toUpperCase())],
        ['Registration',reg||'—'],
        ['Owner',(isMil?'🎖️ ':'')+owner||'—'],
        ['Type',type||'—'],
        ['Manufacturer',mfr||'—'],
        ['ICAO Type',icaoType||'—'],
        ['Country',country||'—'],
    ];
    let html='';
    if(isMil)html+='<div style="background:rgba(255,160,0,0.15);border:1px solid rgba(255,160,0,0.3);border-radius:6px;padding:6px;text-align:center;margin-bottom:8px;color:#ffa000;font-weight:600">🎖️ Military Aircraft</div>';
    html+=dbFields.map(f=>`<div class="info-row"><span class="lbl">${f[0]}</span><span class="val">${f[1]}</span></div>`).join('');
    if(urlThumb||url){
        html+=`<div class="photo"><img src="${urlThumb||url}" alt="${reg}" onerror="this.parentElement.style.display='none'"></div>`;
    }
    if(src)html+=`<div style="text-align:right;color:var(--dim);font-size:10px;margin-top:6px">source: ${src}</div>`;
    body.innerHTML=html;
}

async function loadAircraft(){
    try{
        const r=await fetch('/api/aircraft');
        const d=await r.json();
        acData=d.aircraft||[];
        document.getElementById('ac-count').textContent=`✈ ${acData.length} aircraft`;
        document.getElementById('ac-msgs').textContent=`Total messages: ${(d.messages||0).toLocaleString()}`;
        document.getElementById('ac-update').textContent=`Updated: ${new Date().toLocaleTimeString()}`;
        renderAC();
    }catch(e){}
}

loadAircraft();
setInterval(loadAircraft,1000);
fetch('/api/config').then(r=>r.json()).then(d=>{if(d.station){stationLat=d.station.lat;stationLon=d.station.lon;}}).catch(()=>{});
fetch('/api/status').then(r=>r.json()).then(d=>{const b=document.getElementById('ver-badge');if(b&&d.version)b.textContent='v'+d.version;}).catch(()=>{});

// Position fixed tooltips on hover
document.addEventListener('mouseover', function(e) {
    var tt = e.target.closest('.tt');
    if (!tt) return;
    var box = tt.querySelector('.ttbox');
    if (!box) return;
    var rect = tt.getBoundingClientRect();
    var bw = box.offsetWidth || 280;
    var bh = box.offsetHeight || 100;
    var left = rect.left - bw - 8;
    if (left < 4) left = rect.right + 8;
    var top = rect.top - bh / 2 + rect.height / 2;
    if (top < 4) top = 4;
    if (top + bh > window.innerHeight - 4) top = window.innerHeight - bh - 4;
    box.style.left = left + 'px';
    box.style.top = top + 'px';
});
</script>
