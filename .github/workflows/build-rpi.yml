name: Build for Raspberry Pi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arm64 cross-compilation
        run: |
          sudo dpkg --add-architecture arm64
          . /etc/os-release
          sudo rm -f /etc/apt/sources.list.d/arm64-ports.list
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if grep -q '^deb ' "$f" 2>/dev/null; then
              sudo sed -i '/^\s*deb/ { /\[/! s/deb /deb [arch=amd64] /; /\[/ { /arch=/! s/\[/[arch=amd64 /; } }' "$f"
            fi
            if grep -q '^Types:' "$f" 2>/dev/null; then
              grep -q 'Architectures:' "$f" || sudo sed -i '/^Types:/a Architectures: amd64' "$f"
            fi
          done
          printf "deb [arch=arm64] http://ports.ubuntu.com/ %s main restricted universe\ndeb [arch=arm64] http://ports.ubuntu.com/ %s-updates main restricted universe\ndeb [arch=arm64] http://ports.ubuntu.com/ %s-security main restricted universe\n" \
            "${VERSION_CODENAME}" "${VERSION_CODENAME}" "${VERSION_CODENAME}" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update || true
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libusb-1.0-0-dev:arm64 libssl-dev:arm64 libncurses-dev:arm64 zlib1g-dev:arm64

      - name: Clone and build libsdrgg
        run: |
          git clone https://github.com/47494749/libsdrgg.git ../libsdrgg
          cd ../libsdrgg
          make static CXX=aarch64-linux-gnu-g++ AR=aarch64-linux-gnu-ar

      - name: Patch Makefile for cross-compile warnings
        run: |
          sed -i 's/-Werror/-Werror -Wno-deprecated-declarations/' Makefile

      - name: Build dump1090-gg (aarch64)
        run: |
          make -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            ARCH=aarch64 \
            SDRGG=yes \
            SDRGG_PREFIX=../libsdrgg

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dump1090-gg-arm64
          path: |
            dump1090
            panel/
