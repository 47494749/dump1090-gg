name: Build for Raspberry Pi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arm64 cross-compilation
        run: |
          sudo dpkg --add-architecture arm64
          # Add arm64 sources only for Ubuntu ports (not third-party repos)
          . /etc/os-release
          cat <<SOURCES | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ ${VERSION_CODENAME} main restricted universe
          deb [arch=arm64] http://ports.ubuntu.com/ ${VERSION_CODENAME}-updates main restricted universe
          SOURCES
          # Pin existing repos to amd64 only
          for f in /etc/apt/sources.list.d/*.list; do
            [ "$f" = "/etc/apt/sources.list.d/arm64-ports.list" ] && continue
            sudo sed -i '/^\s*deb/ { /\[.*arch=/ !s/deb /deb [arch=amd64] /; }' "$f"
          done
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libusb-1.0-0-dev:arm64 libssl-dev:arm64 libncurses-dev:arm64 zlib1g-dev:arm64

      - name: Clone and build libsdrgg
        run: |
          git clone https://github.com/47494749/libsdrgg.git ../libsdrgg
          cd ../libsdrgg
          make static CXX=aarch64-linux-gnu-g++ AR=aarch64-linux-gnu-ar

      - name: Build dump1090-gg (aarch64)
        run: |
          make -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            ARCH=aarch64 \
            SDRGG=yes \
            SDRGG_PREFIX=../libsdrgg \
            PKG_CONFIG="aarch64-linux-gnu-pkg-config"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dump1090-gg-arm64
          path: |
            dump1090
            panel/
